apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-assignment-tracker
  labels:
    app: student-assignment-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-assignment-tracker
  template:
    metadata:
      labels:
        app: student-assignment-tracker
    spec:
      containers:
        - name: student-assignment-tracker
          image: student-assignment-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: student-assignment-tracker
spec:
  type: NodePort
  selector:
    app: student-assignment-tracker
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
